name: Full and Final Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Android Project environment
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

    - name: Compile and Build Package
      run: ./gradlew assembleDebug --no-daemon

    - name: Export Final Installer File
      uses: actions/upload-artifact@v4
      with:
        name: final-app-installer
        path: "**/build/outputs/apk/**/*.apk"
