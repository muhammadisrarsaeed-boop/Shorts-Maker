name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ensure Gradle Wrapper Executable Permissions
      run: |
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build Debug APK with Gradle Discovery
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./app/gradlew" ]; then
          cd app && ./gradlew assembleDebug
        else
          find . -name "gradlew" -execdir ./gradlew assembleDebug \;
        fi

    - name: Locating and Uploading Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/*/*.apk
