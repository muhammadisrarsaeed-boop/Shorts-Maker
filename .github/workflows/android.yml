name: Full and Final Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Official Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1' # Forces the runner to safely adapt to the exact framework required

    - name: Compile and Build Package
      run: gradle assembleDebug --no-daemon

    - name: Export Final Installer File
      uses: actions/upload-artifact@v4
      with:
        name: final-app-installer
        path: "**/build/outputs/apk/**/*.apk"
